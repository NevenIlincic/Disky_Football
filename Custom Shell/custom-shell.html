<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		@font-face {
			font-family: "KdharThorFont";
			src: url("KdamThmorPro-Regular.ttf") format("truetype");
			font-weight: normal;
			font-style: normal;
			font-display: block;
		}
		html,
		body {
			margin: 0;
			height: 100%;
			background: #1a1a2e;
			overflow: hidden;
		}

		#canvas {
			display: block;
			width: 100%;
			height: 100%;
		}

		#loader {
			position: fixed;
			inset: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px;
			color: #fff;
			font-family: "KdharThorFont", sans-serif;

			background: #1a1a2e url("loading_background.jpg") center / cover no-repeat;
		}

		#loader img{
			width: 627px;
			height: 56px;
		}

		#bar {
			width: 280px;
			height: 14px;
			background: #ffffff;
			border-radius: 3px;
			overflow: hidden;
		}

		#fill {
			width: 0%;
			height: 100%;
			background: #CD1717;
			transition: width .15s;
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>

<body>
	<canvas id="canvas"></canvas>
	<div id="loader">
		<img src="logo.png" width="160" alt="">
		<div id="bar">
			<div id="fill"></div>
		</div>
		<div id="pct">0%</div>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const engine = new Engine(GODOT_CONFIG);
		const fill = document.getElementById('fill');
		const pct = document.getElementById('pct');
		const loader = document.getElementById('loader');

		engine.startGame({
			onProgress: function (current, total) {
				if (total > 0) {
					const p = Math.round(current / total * 100);
					fill.style.width = p + '%';
					pct.textContent = p + '%';
				} else {
					// server ne šalje veličinu fajla, pokaži "neodređeni" napredak
					pct.textContent = 'Loading...';
				}
			}
		}).then(() => {
			loader.style.display = 'none';
		}).catch(err => {
			pct.textContent = 'Error: ' + err.message;
		});
	</script>
</body>

</html>
